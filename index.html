<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA APPS STORE</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d1117; color: #f3f4f6; }
        .bg-grid { background-image: radial-gradient(rgba(59, 130, 246, 0.15) 1px, transparent 1px); background-size: 20px 20px; }
        .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(59, 130, 246, 0.2); }
        /* Memastikan tombol aman dari benturan sentuhan */
        button, a, input, select { position: relative; z-index: 20; }
    </style>
</head>
<body class="bg-grid min-h-screen pb-32">

    <!-- HEADER / NAVBAR ATAS -->
    <header class="sticky top-0 z-40 bg-[#0d1117]/95 backdrop-blur-md border-b border-blue-900/40 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white font-black px-2.5 py-1 rounded-lg text-xs tracking-wider shadow-lg shadow-blue-600/30">ASTRA</div>
            <h1 class="text-lg font-extrabold tracking-widest text-white">ASTRA</h1>
        </div>
        <div class="flex items-center space-x-2">
            <div class="bg-gray-900 border border-blue-500/30 px-3 py-1 rounded-full flex items-center space-x-1.5 text-xs font-bold text-blue-400">
                <span>💎</span><span>1</span>
            </div>
            <button onclick="toggleSound()" id="sound-btn" class="p-2 rounded-xl bg-gray-900 border border-gray-800 text-gray-300">🔊</button>
            <button onclick="openCartModal()" class="relative p-2 rounded-xl bg-gray-900 border border-gray-800 text-gray-300">
                🛒
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-blue-600 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center text-white hidden">0</span>
            </button>
            <button onclick="openAdminModal()" class="p-2 rounded-xl bg-blue-600/20 border border-blue-500/40 text-blue-400">⚙️</button>
        </div>
    </header>

    <!-- KONTEN UTAMA HALAMAN -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- TAB 1: BERANDA -->
        <section id="tab-beranda" class="space-y-6">
            <div class="glass-card rounded-2xl p-4 relative overflow-hidden shadow-xl border-t-2 border-t-blue-500">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center space-x-2">
                        <div class="bg-blue-600 text-white font-black px-2 py-0.5 rounded text-[10px]">ASTRA</div>
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Verified Store</span>
                    </div>
                    <span class="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full font-medium">ID: AST-0539</span>
                </div>
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-black text-white">ASTRA STORE</h2>
                        <p class="text-xs text-gray-400">Stok Ready: <span id="stat-ready" class="text-blue-400 font-bold">1</span> | Terjual: <span id="stat-sold" class="text-gray-300 font-bold">3</span></p>
                    </div>
                    <button onclick="switchTab('stok')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-lg shadow-blue-600/30">
                        LIHAT STOK →
                    </button>
                </div>
            </div>

            <!-- Pusat Info -->
            <div class="space-y-2.5">
                <h3 class="text-xs font-extrabold text-gray-400 uppercase tracking-widest">Pusat Info</h3>
                <a href="https://wa.me/6285656021660" target="_blank" class="glass-card rounded-xl p-3.5 flex items-center justify-between block">
                    <div class="flex items-center space-x-3">
                        <span class="text-xl">💬</span>
                        <div>
                            <div class="text-sm font-bold text-white">Chat Admin</div>
                            <div class="text-xs text-gray-400">Tanya stok langsung via WhatsApp</div>
                        </div>
                    </div>
                    <span class="text-blue-400 font-bold">→</span>
                </a>
            </div>
        </section>

        <!-- TAB 2: STOK -->
        <section id="tab-stok" class="space-y-4 hidden">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-extrabold uppercase tracking-widest text-white">Inventaris Toko</h2>
                <span id="stok-count" class="text-xs text-gray-400 font-medium">0 akun</span>
            </div>
            <div class="relative">
                <input type="text" id="search-input" oninput="renderStok()" placeholder="Cari game atau kode akun..." class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
            </div>
            <div id="product-list" class="space-y-3"></div>
        </section>

        <!-- TAB 3: FAVORIT -->
        <section id="tab-favorit" class="space-y-4 hidden">
            <h2 class="text-sm font-extrabold uppercase tracking-widest text-white">Favorit Tersimpan</h2>
            <div id="favorit-list" class="space-y-3"></div>
        </section>

        <!-- TAB 4: INFO -->
        <section id="tab-info" class="space-y-4 hidden">
            <h2 class="text-sm font-extrabold uppercase tracking-widest text-white">Pengaturan Toko</h2>
            <div class="glass-card rounded-2xl p-4 space-y-4 border border-blue-500/30">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-sm font-bold text-white">Favorit tersimpan</div>
                        <div id="fav-count-text" class="text-xs text-gray-400">0 akun</div>
                    </div>
                    <button onclick="clearFavorites()" class="px-3 py-1.5 bg-red-500/20 text-red-400 text-xs font-bold rounded-xl">KOSONGKAN</button>
                </div>
            </div>
        </section>

    </main>

    <!-- BOTTOM NAVBAR / NAVIGASI BAWAH (Z-INDEX TINGGI AGAR MUDAH DIKLIK) -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0d1117] border-t border-blue-900/60 px-2 py-3 flex justify-around items-center z-50 shadow-2xl">
        <button onclick="switchTab('beranda')" id="nav-beranda" class="flex flex-col items-center space-y-1 text-blue-500 w-1/5 py-1">
            <span class="text-lg">🏠</span>
            <span class="text-[10px] font-bold">BERANDA</span>
        </button>
        <button onclick="switchTab('stok')" id="nav-stok" class="flex flex-col items-center space-y-1 text-gray-400 w-1/5 py-1">
            <span class="text-lg">📦</span>
            <span class="text-[10px] font-bold">STOK</span>
        </button>
        <button onclick="switchTab('favorit')" id="nav-favorit" class="flex flex-col items-center space-y-1 text-gray-400 w-1/5 py-1">
            <span class="text-lg">🤍</span>
            <span class="text-[10px] font-bold">FAVORIT</span>
        </button>
        <button onclick="switchTab('info')" id="nav-info" class="flex flex-col items-center space-y-1 text-gray-400 w-1/5 py-1">
            <span class="text-lg">🛡️</span>
            <span class="text-[10px] font-bold">INFO</span>
        </button>
        <button onclick="openCartModal()" class="flex flex-col items-center space-y-1 text-gray-400 w-1/5 py-1">
            <span class="text-lg">🛒</span>
            <span class="text-[10px] font-bold">KERANJANG</span>
        </button>
    </nav>

    <!-- MODAL PANEL ADMIN -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-[#111827] border border-blue-500/40 w-full max-w-md rounded-2xl p-5 space-y-4">
            <div class="flex items-center justify-between border-b border-gray-800 pb-3">
                <h3 class="text-sm font-extrabold text-white">PANEL ADMIN</h3>
                <button onclick="closeAdminModal()" class="text-gray-400 text-sm px-2">✕ Tutup</button>
            </div>
            <div class="space-y-3 text-xs">
                <input type="text" id="admin-game" placeholder="Nama Game (cth: Mobile Legends)" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-white">
                <input type="text" id="admin-kode" placeholder="Kode Akun (cth: JB-0007)" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-white">
                <input type="number" id="admin-harga" placeholder="Harga (cth: 50000)" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-white">
                <select id="admin-status" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-white">
                    <option value="READY">READY</option>
                    <option value="TERJUAL">TERJUAL</option>
                </select>
                <button onclick="addNewProduct()" class="w-full py-2.5 bg-blue-600 text-white font-bold rounded-xl shadow-lg">+ TAMBAH STOK BARU</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        let products = JSON.parse(localStorage.getItem('astra_products')) || [
            { id: 1, game: 'JBKU', code: 'JB-0006', price: 3000, status: 'READY' },
            { id: 2, game: 'MOBILE LEGENDS', code: 'JB-0004', price: 40000, status: 'TERJUAL' }
        ];
        let favorites = JSON.parse(localStorage.getItem('astra_favorites')) || [];

        function switchTab(tabId) {
            ['beranda', 'stok', 'favorit', 'info'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const nav = document.getElementById(`nav-${t}`);
                if(el) el.classList.add('hidden');
                if(nav) nav.className = "flex flex-col items-center space-y-1 text-gray-400 w-1/5 py-1";
            });
            const activeEl = document.getElementById(`tab-${tabId}`);
            const activeNav = document.getElementById(`nav-${tabId}`);
            if(activeEl) activeEl.classList.remove('hidden');
            if(activeNav) activeNav.className = "flex flex-col items-center space-y-1 text-blue-500 w-1/5 py-1";
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if(tabId === 'stok') renderStok();
            if(tabId === 'favorit') renderFavorit();
        }

        function renderStok() {
            const listEl = document.getElementById('product-list');
            const searchVal = (document.getElementById('search-input')?.value || '').toLowerCase();
            let filtered = products.filter(p => p.code.toLowerCase().includes(searchVal) || p.game.toLowerCase().includes(searchVal));
            
            document.getElementById('stok-count').innerText = `${filtered.length} akun`;
            if(filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-gray-500 text-xs">Tidak ada stok.</div>`;
                return;
            }
            listEl.innerHTML = filtered.map(p => `
                <div class="glass-card rounded-2xl p-4 border border-blue-500/20 flex items-center justify-between">
                    <div>
                        <div class="text-[10px] text-blue-400 font-bold">${p.status}</div>
                        <h4 class="text-sm font-bold text-white">${p.game} (${p.code})</h4>
                        <div class="text-sm font-black text-blue-400">Rp ${p.price.toLocaleString('id-ID')}</div>
                    </div>
                    ${p.status === 'READY' ? `<a href="https://wa.me/6285656021660?text=Minat%20akun%20${p.code}" target="_blank" class="px-3 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">BELI</a>` : `<span class="text-xs text-gray-500 font-bold">TERJUAL</span>`}
                </div>
            `).join('');
        }

        function renderFavorit() {
            const listEl = document.getElementById('favorit-list');
            const favProducts = products.filter(p => favorites.includes(p.id));
            if(favProducts.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-gray-500 text-xs">Belum ada favorit.</div>`;
                return;
            }
            listEl.innerHTML = favProducts.map(p => `<div class="glass-card rounded-xl p-3 text-white text-xs">${p.game} - ${p.code}</div>`).join('');
        }

        function openAdminModal() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }
        function openCartModal() { alert('Keranjang kosong'); }
        function toggleSound() { alert('Suara diaktifkan'); }

        function addNewProduct() {
            const game = document.getElementById('admin-game').value;
            const code = document.getElementById('admin-kode').value;
            const price = Number(document.getElementById('admin-harga').value);
            const status = document.getElementById('admin-status').value;
            if(!game || !code || !price) { alert('Isi semua kolom!'); return; }
            products.unshift({ id: Date.now(), game, code, price, status });
            localStorage.setItem('astra_products', JSON.stringify(products));
            closeAdminModal();
            renderStok();
            alert('Berhasil ditambah!');
        }
    </script>
</body>
</html>
